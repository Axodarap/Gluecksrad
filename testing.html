<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glücksrad v0.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wheel-section">
        <h1>Glücksrad</h1>
        <div class="wheel" id="wheel">
            <!-- add your wheel graphics here-->
        </div>
    </div>
    
    <div class="input-section">
        <div class="input-container">
            <input type="text" id="itemInput" placeholder="Enter word, number, or phrase..." maxlength="100">
            <button class="btn btn-add" onclick="addItem()">Add</button>
        </div>
    </div>

    <div class="items-list" id="itemsList">
        
    </div>

    <button class="btn btn-pick" id="pickBtn" onclick="pickRandom()" disabled>
        Pick Random Item
    </button>
    
    <button class="btn btn-clear" onclick="clearAll()">Clear All</button>

    <div class="result" id="result">
        Ready to pick! Add some items first.
    </div>
     <script src="main.js"></script>  
</body>
</html>
