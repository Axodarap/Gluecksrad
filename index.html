<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Glücksrad v0.1</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Main container for layout -->
        <div class="container"> 
            <h1>Glücksrad</h1>
            <div class="wheel-display", id ="wheelDisplay">
                <div class="empty-wheel">
                    Add items to create<br>your wheel!
                </div>
            </div>
            <button class="btn btn-pick" id="pickBtn" onclick="pickRandom()" disabled>
            Pick Random Item
            </button>            
            <div class="input-container">
                <input type="text" id="itemInput" placeholder="What would you like to spin?" maxlength="100">
                <button class="btn btn-add" onclick="addItem()">Add</button>
            </div>
            <div class="items-list" id="itemsList">
                <!-- list of items will be displayed here -->
            </div>

            <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
            
                
                <!-- Result Modal -->
            <div class="modal-overlay" id="resultModal">
                <div class="modal">
                    <h2> Winner!</h2>
                    <div class="modal-result" id="modalResult"></div>
                    <div class="modal-buttons">
                    <button class="btn btn-remove-winner" onclick="removeWinner()">
                        remove
                    </button>
                    <button class="btn btn-close" onclick="closeModal()">
                        keep
                    </button>
                </div>
            </div>
        </div>
        <script src="main.js"></script>  
    </body>
</html>
