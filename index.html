<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Spin</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 onclick="spinWheel();">Spin</h1>
        <div class="wheel-container" id="wheelContainer">
            <div class="wheel-child wheel-pointer">
                <!-- pointer, stays still, centered to wheel-container -->
            </div>
            <canvas class="wheel-child" id="wheelCanvas"></canvas>
            <!--<div class="wheel-child circle" id="wheel">-->
                <!-- actual spinning part, also centered to wheel-container-->
                
            </div>
        </div>
        <button id="drawWheel" onclick="drawWheel();">Draw Wheel</button>
        <script src="main.js"></script>
    </body>
</html>
