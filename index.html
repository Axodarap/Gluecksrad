<html> 
    <head>
        <title>Glücksrad v0.1</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <!-- Add icon library -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div class="screen" id="mainScreen">
            <div class="wheel-container" id="wheelContainer"></div>
            <div class="empty-wheel-text" id="emptyWheelText">
                looking pretty empty here...
            </div>
            <div class="edit-wheel-button" id="editWheelButton">
                <i class="fa-solid fa-pen"></i>
            </div>
        </div>

        <div class="screen secondary-screen" id="secondaryScreen">
            <div class="add-item-header">
                <button class="close-add-item-button" id="CloseAddItemButton">BACK</button>
                <button class="clear-button" id="ClearButton">CLEAR</button>
            </div>

            <div class ="item-list-container" id="itemListContainer">
                <div class="item-list" id="itemList">
                    <!-- Item list will be populated here -->
                </div>
            </div>
            <div class="add-item-container" id="addItemContainer">
                 <input 
                    type="text" 
                    class="add-item-input" 
                    placeholder="what would you like to add..."
                    id="addItemInput"
                    autocomplete="off"
                >
                <button class="add-item-button" id="addItemButton">ADD</button>
            </div>
            
        </div>

        <div class="results-modal" id="resultsModal">
            <div class="modal-content">
                <h2 id="winnerTitle">Results</h2>
                <div class="modal-result" id="modalResult"></div>
                    <div class="modal-buttons">
                        <button class="btn-remove-winner" id="btnRemoveWinner">
                            remove
                        </button>
                        <button class="btn-modal-close" id="btnModalClose">
                            keep
                        </button>
                </div>
            </div>
        </div>

        <script type="module" src="main.js"></script>
    </body>
</html>
