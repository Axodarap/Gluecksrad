<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Spin</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Glücksrad v0.1</h1>
        <div class="wheel-container" id="wheelContainer">
            <div class="wheel-child wheel-pointer">
                <!-- pointer, stays still, centered to wheel-container -->
            </div>
            <canvas class="wheel-child" id="wheelCanvas"></canvas>
                <!-- actual spinning part, also centered to wheel-container-->    
            <div class="wheel-child wheel-center" onclick="spinWheel();"></div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
