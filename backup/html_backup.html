<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Glücksrad v0.1</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Main container for layout -->
        
        <div class="container"> 
            <h1>Glücksrad</h1>
            <div class="wheel-container" id="wheelContainer">
                <div class="wheel-pointer">
                    <!-- Pointer for the wheel -->
                </div>
                <div class="wheel-display" id="wheelDisplay">
                    <!-- Wheel will be rendered here -->
                </div>

            </div>
            
            <button class="btn btn-spin" id="spinBtn" onclick="spinWheel()" disabled>
                Pick Random Item
            </button>      
            <div class="item-input-container">
                <input type="text" id="itemInput" placeholder="What would you like to spin?" maxlength="100">
                <button class="btn btn-add" onclick="addItem()">Add</button>
            </div>
            <div class="items-list" id="itemsList">
                <!-- list of items will be displayed here -->
            </div>
            <button class="btn btn-clear" onclick="clearAll()">Clear All</button>   
            
            <!-- Result Popup -->
            <div class="popup-overlay" id="resultPopup">
                <div class="popup">
                    <h2> Winner!</h2>
                    <div class="popup-result" id="popupResult"></div>
                    <div class="popup-buttons">
                    <button class="btn btn-remove-winner" onclick="removeWinner()">
                        remove
                    </button>
                    <button class="btn btn-close" onclick="closePopup()">
                        keep
                    </button>
                </div>
            </div>
        </div>
        <script src="main.js"></script>  
    </body>
</html>
